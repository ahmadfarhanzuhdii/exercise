<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .order-container {
            display: flex;
            gap: 24px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Semua section */
        .order-summary,
        .order-items,
        .customer-info {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Desktop */
        .order-summary {
            flex: 1;
            order: 3;
        }

        .order-items {
            flex: 2;
            order: 1;
        }

        .customer-info {
            flex: 1;
            order: 2;
        }

        /* Item */
        .item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .item:last-child {
            border-bottom: none;
        }

        /* Tablet */
        @media (max-width: 992px) {

            .order-container {
                flex-wrap: wrap;
            }

            .order-items {
                flex: 1 1 100%;
                order: 1;
            }

            .customer-info {
                flex: 1;
                order: 2;
            }

            .order-summary {
                flex: 1;
                order: 3;
            }
        }

        /* Mobile */
        @media (max-width: 576px) {

            .order-container {
                flex-direction: column;
                padding: 12px;
                gap: 16px;
            }

            .order-items {
                order: 1;
            }

            .order-summary {
                order: 2;
            }

            .customer-info {
                order: 3;
            }

            .order-summary,
            .order-items,
            .customer-info {
                width: 100%;
                padding: 18px;
            }

            .item {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div class="order-container">

    <div class="order-summary">
        <h2>Order Summary</h2>
        <p>2 items</p>
        <strong>Rp150.000</strong>
    </div>

    <div class="order-items">
        <h2>Order Items</h2>

        <div class="item">
            <span>Fresh Orange Juice</span>
            <span>Rp50.000</span>
        </div>

        <div class="item">
            <span>Apple Juice</span>
            <span>Rp100.000</span>
        </div>
    </div>

    <div class="customer-info">
        <h2>Customer Information</h2>
        <p>Ahanzu</p>
        <p>Jakarta, Indonesia</p>
    </div>
</div>
</body>
</html>
