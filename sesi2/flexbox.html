<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .flex-respoinsive {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            flex-direction: row;
        }
        @media (max-width: 600px) {
            .flex-respoinsive {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>

</head>
<body>
    <div class="flex-respoinsive">
        <div style="background-color: red; width: 100px; height: 100px;"></div>
        <div style="background-color: blue; width: 100px; height: 100px;"></div>
        <div style="background-color: green; width: 100px; height: 100px;"></div>
        <div style="background-color: yellow; width: 100px; height: 100px;"></div>
        <div style="background-color: purple; width: 100px; height: 100px;"></div>
        <div style="background-color: red; width: 100px; height: 100px;"></div>
        <div style="background-color: blue; width: 100px; height: 100px;"></div>
        <div style="background-color: green; width: 100px; height: 100px;"></div>
        <div style="background-color: yellow; width: 100px; height: 100px;"></div>
        <div style="background-color: purple; width: 100px; height: 100px;"></div>
    </div>
</body>
